<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EDITOR DE SALAS // Guardião</title>
<link rel="stylesheet" href="tools/vendor/fonts.css">
<link rel="stylesheet" href="tools/vendor/fonts-docs.css">
<style>
  :root{--bg:#101214;--panel:#171a1d;--panel2:#1d2125;--line:#2a3035;--ink:#cdd4d8;--ink-dim:#6a767d;--live:#62e0c4;--live-dim:#2f6f62;--warn:#d8a24a;--danger:#d65a5a;
    --font:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Menlo,Consolas,monospace}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:13px;line-height:1.45;overflow:hidden}
  #app{height:100vh;display:flex;flex-direction:column}
  #top{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap;min-height:52px}
  .ttl{font-size:14px;letter-spacing:.22em;font-weight:600}.ttl span{color:var(--live)}
  .sp{flex:1}
  #decks{display:flex;gap:5px;flex-wrap:wrap}
  .btn{background:var(--panel2);border:1px solid var(--line);color:var(--ink);font-family:inherit;font-size:11px;letter-spacing:.08em;padding:6px 11px;border-radius:4px;cursor:pointer;text-decoration:none;display:inline-block}
  .btn:hover{border-color:var(--live)}.btn:disabled{opacity:.35;cursor:default}.btn:disabled:hover{border-color:var(--line)}
  .btn.chip{padding:4px 9px;font-size:10px}.btn.chip.on{border-color:var(--live);color:var(--live)}
  .btn.dng{color:var(--danger)}.btn.dng:hover{border-color:var(--danger)}
  #status{font-size:11px;color:var(--live);letter-spacing:.06em;min-width:150px;text-align:right}
  main{flex:1;display:grid;grid-template-columns:230px 1fr 350px;min-height:0}
  aside{background:var(--panel);overflow:auto;min-height:0}
  #rooms{border-right:1px solid var(--line);display:flex;flex-direction:column;padding:10px}
  #side{border-left:1px solid var(--line);padding:12px}
  input[type=text],input[type=number],select{background:var(--bg);border:1px solid var(--line);border-radius:4px;color:var(--ink);font-family:inherit;font-size:12px;padding:6px 8px;width:100%}
  input:focus,select:focus{outline:none;border-color:var(--live-dim)}
  #rlist{margin-top:8px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:2px}
  .ri{display:flex;justify-content:space-between;gap:6px;background:none;border:1px solid transparent;border-radius:3px;color:var(--ink);font-family:inherit;font-size:12px;padding:5px 8px;cursor:pointer;text-align:left}
  .ri:hover{background:var(--panel2)}.ri.on{border-color:var(--live);color:var(--live);background:var(--panel2)}
  .rm{color:var(--ink-dim);white-space:nowrap}.rm b{color:var(--live)}
  .mut{color:var(--ink-dim);font-size:11px}.live{color:var(--live);font-style:normal}
  #stage{display:flex;flex-direction:column;min-width:0;min-height:0}
  #tools{display:flex;gap:10px;align-items:center;padding:7px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap;font-size:11px;color:var(--ink-dim)}
  #tools label{display:flex;gap:5px;align-items:center}#tools select{width:auto;padding:3px 6px}
  #rname{font-size:13px;color:var(--ink)}
  #cv{flex:1;overflow:auto;background:#d9d6ca;position:relative;line-height:0;min-height:0;touch-action:none;cursor:default}
  #cv svg{display:block;margin:0 auto;user-select:none;-webkit-user-select:none}
  .empty{padding:60px;text-align:center;color:#555;font-size:14px;line-height:1.6}
  .band{position:absolute;border:1px dashed #8a5a1a;background:rgba(208,162,79,.16);pointer-events:none}
  #tip{padding:6px 12px;border-top:1px solid var(--line);font-size:10.5px;color:var(--ink-dim);line-height:1.55;background:var(--panel)}
  #tip b{color:var(--ink)}
  .sh{font-size:10px;letter-spacing:.2em;color:var(--ink-dim);margin:12px 0 6px}.sh:first-child{margin-top:0}
  .cats{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px}
  .pg{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;max-height:300px;overflow:auto;padding:2px}
  .pt{width:76px;background:#eceae2;border:1px solid #9a9889;border-radius:3px;padding:4px 2px 3px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:inherit;color:#222;font-size:9.5px;line-height:1.15}
  .pt svg{width:38px;height:38px}.pt:hover{border-color:var(--live)}.pt.on{outline:2px solid #d0a24f;border-color:#d0a24f;background:#f3eedb}
  .ib{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:10px}
  .ib b{color:var(--ink);font-size:13px}
  .g2{display:grid;grid-template-columns:1fr 1fr;gap:6px 8px;margin:8px 0}
  .g2 label,.ib label.ck{font-size:10px;letter-spacing:.1em;color:var(--ink-dim)}
  .g2 input{margin-top:2px}
  .ib label.ck{display:flex;gap:6px;align-items:center;margin:6px 0;font-size:11px;letter-spacing:.02em;color:var(--ink)}
  .ib label.ck input{width:auto}
  .row{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}.row select{flex:1}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="station-data.js?v=p1"></script>
<script src="station-eq.js?v=p1"></script>
<script src="station-render.js?v=p1"></script>
<script src="station-props.js?v=m6"></script>
<script src="station-props-more.js?v=m6"></script>
<script src="station-props-rooms.js?v=n1"></script>
<script src="station-props-gm.local.js"></script>
<script src="station-layout.js?v=p1"></script>
<script src="station-layouts.js?v=p1"></script>
<script src="editor-salas.js?v=p1"></script>
<script>
var _unsubAuth=firebase.auth().onAuthStateChanged(function(u){
  if(!u)return;_unsubAuth();
  window.EDITOR=EditorSalas.init(sessionRef);
});
</script>
</body>
</html>
